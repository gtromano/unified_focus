[build-system]
requires = [
    "scikit-build-core>=0.5.0",
    "pybind11>=2.11.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "focus_cpt"
version = "0.1.5"
description = "Online Changepoint Detection in Univariate and Multivariate Data Streams using FOCUS algorithms"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Gaetano Romano", email = "g.romano@lancaster.ac.uk"},
    {name = "Kes Ward", email = "k.ward4@lancaster.ac.uk"},
    {name = "Yuntang Fan", email = "y.yuntang@lancaster.ac.uk"},
    {name = "Guillem Rigaill", email = "guillem.rigaill@inrae.fr"},
    {name = "Vincent Runge", email = "vincent.runge@univ-evry.fr"},
    {name = "Paul Fearnhead", email = "p.fearnhead@lancaster.ac.uk"},
    {name = "Idris A. Eckley", email = "i.eckley@lancaster.ac.uk"}
]
keywords = ["changepoint", "detection", "statistics", "time-series"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "mypy>=1.0",
]
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.0",
]

[project.urls]
Homepage = "https://github.com/gtromano/unified_focus"
Documentation = "https://github.com/gtromano/unified_focus"
Repository = "https://github.com/gtromano/unified_focus"
Issues = "https://github.com/gtromano/unified_focus/issues"

[tool.scikit-build]
# Minimum required CMake version
cmake.version = ">=3.15"

# Build directory
build-dir = "build/{wheel_tag}"

# Verbose build output for debugging (optional, can be removed for production)
build.verbose = false

# Wheel settings
wheel.packages = ["focus_cpt"]

# Installation settings
install.strip = false

[tool.scikit-build.cmake.define]
# You can add CMake defines here if needed
# CMAKE_BUILD_TYPE = "Release"

[tool.cibuildwheel]
# Configuration for building wheels on CI
build = "cp38-* cp39-* cp310-* cp311-* cp312-*"
skip = "*-musllinux_* *-win32 *-manylinux_i686"

# Before build, install Qhull
[tool.cibuildwheel.linux]
before-all = "yum install -y qhull-devel || apt-get update && apt-get install -y libqhull-dev"
environment = {CMAKE_BUILD_PARALLEL_LEVEL = "4"}

[tool.cibuildwheel.macos]
before-all = "brew install qhull"
environment = {CMAKE_BUILD_PARALLEL_LEVEL = "4"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
